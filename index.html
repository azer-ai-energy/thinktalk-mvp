<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkTalk MVP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #2563eb; }

        p { font-size: 18px; }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background-color: #1d4ed8; }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            h1 { font-size: 36px; }
            p { font-size: 20px; }

            button {
                display: block;
                width: 100%;
                margin: 10px 0;
                font-size: 20px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎤 ThinkTalk MVP</h1>

        <p>Improve your public speaking through daily AI-inspired speech exercises.</p>
        <button onclick="setLanguage('en')">🇬🇧 English</button>
        <button onclick="setLanguage('ru')">🇷🇺 Russian</button>
        <button onclick="setLanguage('az')">🇦🇿 Azerbaijani</button>

        <button onclick="showDailyChallenge()">Today's Challenge</button>
        <button onclick="showRandomTopic()">Random Topic</button>
        <button onclick="trackProgress()">Track Progress</button>

        <h2>Your Exercise</h2>
        <p id="result">Click a button to start.</p>

        <h3>Speech Timer</h3>
        <p id="timer">60</p>

        <button onclick="startTimer()">Start Speech</button>
        <button onclick="stopTimer()">Stop</button>
    </div>

    <script>
        const topics = {

    en: [
        "Speak for 60 seconds about your biggest achievement this year.",
        "Describe a mistake you made and what you learned from it.",
        "Explain why communication is important in business.",
        "Tell a short story about a difficult decision."
    ],

    ru: [
        "Расскажите о своем самом большом достижении в этом году.",
        "Опишите ошибку и чему она вас научила.",
        "Объясните, почему коммуникация важна в бизнесе.",
        "Расскажите короткую историю о сложном решении."
    ],

    az: [
        "Bu il ən böyük nailiyyətiniz haqqında danışın.",
        "Buraxdığınız səhvi və ondan nə öyrəndiyinizi izah edin.",
        "Ünsiyyətin biznesdə niyə vacib olduğunu izah edin.",
        "Çətin bir qərar haqqında qısa hekayə danışın."
    ]

};

        let completedChallenges = 0;
        let countdown;
        let currentLanguage = "en";

        function setLanguage(lang) {

    currentLanguage = lang;

    document.getElementById("result").innerText =
        "Language selected: " + lang.toUpperCase();

}
       function showDailyChallenge() {
    document.getElementById("result").innerText =
    dailyChallenges[currentLanguage];
}

       function showRandomTopic() {

    const randomIndex =
        Math.floor(Math.random() * topics[currentLanguage].length);

    document.getElementById("result").innerText =
        topics[currentLanguage][randomIndex];
}

        function trackProgress() {
            completedChallenges++;
            document.getElementById("result").innerText =
                "Progress: You completed " + completedChallenges + " practice session(s).";
        }

        function startTimer() {
            clearInterval(countdown);

            let timeLeft = 60;
            document.getElementById("timer").innerHTML = timeLeft;

            countdown = setInterval(function () {
                timeLeft--;
                document.getElementById("timer").innerHTML = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById("timer").innerHTML = "Time is up!";
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(countdown);
        }
    </script>
</body>
</html>
